<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frag Elizabeth · KI-Assistent</title>
<meta name="description" content="Fragen Sie meinen KI-Assistenten zu meiner Erfahrung als Business Analystin und Product Owner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Gleiche Optik wie das Portfolio: warmes Weiss, Serif-Titel, Lila als Akzent */
:root{
  color-scheme:light;
  --bg:#fcfbfa; --ink:#1f1d24; --muted:#6b6873; --line:#e7e4ea; --soft:#f4f2f6;
  --accent:#6d4fa0; --accent-soft:#ece6f5;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
button,input{font:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.top{position:sticky;top:0;z-index:5;background:rgba(252,251,250,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:780px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap}
.back:hover{color:var(--ink)}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px}
.lang button{all:unset;cursor:pointer;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--muted);padding:4px 9px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:28px 16px 12px;display:flex;flex-direction:column;gap:22px}
.intro{display:grid;gap:8px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#3f8a5f}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1;margin:0}
h1 em{color:var(--accent)}
.intro p{margin:0;color:var(--muted);max-width:58ch}

.log{display:flex;flex-direction:column;gap:14px}
.msg{scroll-margin-bottom:140px;max-width:88%;padding:12px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(31,29,36,.04)}
.msg.bot .who{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.src{display:block;margin-top:8px;font-size:12.5px;color:var(--muted)}
.typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--accent);opacity:.4;animation:b 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes b{40%{opacity:1;transform:translateY(-3px)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink);transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}

.ask{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(252,251,250,0));padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.ask form{max-width:780px;margin:0 auto;display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 8px 30px rgba(31,29,36,.08)}
.ask input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px}
.ask button{border:0;cursor:pointer;background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px}
.ask button:disabled{opacity:.5;cursor:default}
.note{max-width:780px;margin:8px auto 0;font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="back" id="back" href="https://claude.ai/artifact/HfF94WXueYMea749v9METS">← Portfolio</a>
    <div class="lang" role="group" aria-label="Sprache / Language / Idioma">
      <button type="button" data-l="de" aria-pressed="true">DE</button><button type="button" data-l="en" aria-pressed="false">EN</button><button type="button" data-l="es" aria-pressed="false">ES</button>
    </div>
  </div>
</header>

<main>
  <section class="intro">
    <p class="eyebrow"><i aria-hidden="true"></i><span id="eyebrow"></span></p>
    <h1>Frag <em>Elizabeth</em> 💬</h1>
    <p id="lead"></p>
  </section>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
</main>

<div class="ask">
  <form id="form">
    <label for="q" class="sr" style="position:absolute;left:-9999px" id="qlabel"></label>
    <input id="q" autocomplete="off" maxlength="400">
    <button id="send" type="submit"></button>
  </form>
  <p class="note" id="note"></p>
</div>

<script>
/* Nach dem Deploy hier die Adresse des Cloudflare Workers eintragen */
const API_URL = "https://frag-elizabeth.frag-elizabeth-worker.workers.dev";

const T = {
  de:{eyebrow:"KI-Assistent · RAG", lead:"Fragen Sie meinen KI-Assistenten zu meiner Erfahrung, meinen Kenntnissen und meiner Verfügbarkeit. Er antwortet auf Basis meines Lebenslaufs.", hello:"Hallo! Ich bin der KI-Assistent von Elizabeth. Was möchten Sie über sie wissen?", ph:"Ihre Frage …", send:"Fragen", note:"KI kann Fehler machen. Für Verbindliches: elizacasas@hotmail.com", who:"Frag Elizabeth", src:"Quellen", label:"Ihre Frage an den KI-Assistenten", back:"← Portfolio", offline:"Der Assistent wird gerade eingerichtet. Schreiben Sie Elizabeth gern direkt: elizacasas@hotmail.com", net:"Keine Verbindung. Bitte versuchen Sie es gleich noch einmal.",
      chips:["Welche Erfahrung hat sie mit Medizintechnik?","Ab wann ist sie verfügbar?","Was ist Salva Patitas?"]},
  en:{eyebrow:"AI assistant · RAG", lead:"Ask my AI assistant about my experience, skills and availability. It answers based on my CV.", hello:"Hi! I'm Elizabeth's AI assistant. What would you like to know about her?", ph:"Your question …", send:"Ask", note:"AI can make mistakes. For anything binding: elizacasas@hotmail.com", who:"Frag Elizabeth", src:"Sources", label:"Your question for the AI assistant", back:"← Portfolio", offline:"The assistant is being set up. Feel free to write to Elizabeth directly: elizacasas@hotmail.com", net:"No connection. Please try again in a moment.",
      chips:["What experience does she have in medical technology?","When can she start?","What did she do at Manor?"]},
  es:{eyebrow:"Asistente de IA · RAG", lead:"Pregunte a mi asistente de IA sobre mi experiencia, mis conocimientos y mi disponibilidad. Responde a partir de mi CV.", hello:"¡Hola! Soy el asistente de IA de Elizabeth. ¿Qué le gustaría saber sobre ella?", ph:"Su pregunta …", send:"Preguntar", note:"La IA puede equivocarse. Para algo vinculante: elizacasas@hotmail.com", who:"Frag Elizabeth", src:"Fuentes", label:"Su pregunta para el asistente de IA", back:"← Portafolio", offline:"El asistente se está configurando. Puede escribir a Elizabeth directamente: elizacasas@hotmail.com", net:"Sin conexión. Por favor, inténtelo de nuevo en un momento.",
      chips:["¿Qué experiencia tiene en tecnología médica?","¿Desde cuándo está disponible?","¿Qué es Salva Patitas?"]},
};
const $ = id => document.getElementById(id);
let L = "de", busy = false;

function bubble(text, me, quellen){
  const d = document.createElement("div");
  d.className = "msg " + (me ? "me" : "bot");
  if (!me){ const w = document.createElement("span"); w.className = "who"; w.textContent = T[L].who; d.appendChild(w); }
  d.appendChild(document.createTextNode(text));
  if (quellen && quellen.length){ const s = document.createElement("span"); s.className = "src"; s.textContent = T[L].src + ": " + quellen.join(" · "); d.appendChild(s); }
  $("log").appendChild(d);
  d.scrollIntoView({behavior:"smooth", block:"end"});
  return d;
}
function chips(){
  $("chips").innerHTML = "";
  T[L].chips.forEach(c => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c; b.onclick = () => ask(c); $("chips").appendChild(b); });
}
function setLang(l){
  L = l; const t = T[l];
  document.documentElement.lang = l;
  $("eyebrow").textContent = t.eyebrow; $("lead").textContent = t.lead;
  $("q").placeholder = t.ph; $("qlabel").textContent = t.label; $("send").textContent = t.send;
  $("note").textContent = t.note; $("back").textContent = t.back;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
  if (!$("log").querySelector(".me")){ $("log").innerHTML = ""; bubble(t.hello, false); }
  chips();
  try { localStorage.setItem("lang", l); } catch(e) {}
}
async function ask(frage){
  frage = frage.trim(); if (!frage || busy) return;
  busy = true; $("send").disabled = true; $("chips").innerHTML = "";
  bubble(frage, true); $("q").value = "";
  const wait = bubble("", false); wait.insertAdjacentHTML("beforeend", '<span class="typing" aria-label="…"><span></span><span></span><span></span></span>');
  try {
    if (!API_URL) throw "offline";
    const r = await fetch(API_URL + "/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({frage, ui:L})});
    const j = await r.json();
    wait.remove(); bubble(j.antwort || T[L].net, false, j.quellen);
  } catch(e) {
    wait.remove(); bubble(e === "offline" ? T[L].offline : T[L].net, false);
  }
  busy = false; $("send").disabled = false; $("q").focus();
}
$("form").addEventListener("submit", e => { e.preventDefault(); ask($("q").value); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));

let start = new URLSearchParams(location.search).get("lang");
if (!T[start]) { try { start = localStorage.getItem("lang"); } catch(e) {} }
setLang(T[start] ? start : "de");
</script>
</body>
</html>
